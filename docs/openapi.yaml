          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    $ref: "#/components/schemas/Plan"
                required:
                  - plan
        "400":
          description: 食物引用无效或格式错误（整单拒绝，旧计划保持原样）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDietPlan
      tags:
        - 目标与计划
      summary: 删除饮食计划
      description: 七天目标与食物项级联清理，之后所有日期回落到每日目标。
