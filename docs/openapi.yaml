  /api/v1/training-records/clock:
    get:
      operationId: getTrainingClock
      tags:
        - 训练记录
      summary: 服务端时间校准
      description: "返回当前服务端 UTC 时刻，响应 Cache-Control: private, no-store，不读取或创建训练记录。客户端在创建/保存/结束核对前校准，再按单调计时器计算经过时间，避免设备时钟偏差。"
      parameters:
        - schema:
            type: string
            description: 网页携带的初始账号标识，服务端仅与当前会话比较（不一致 401）；原生客户端可省略
          required: false
          description: 网页携带的初始账号标识，服务端仅与当前会话比较（不一致 401）；原生客户端可省略
          name: x-bodytrace-user
          in: header
      responses:
        "200":
          description: 服务端时刻
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverNow:
                    type: string
                    format: date-time
                    example: 2026-10-27T12:00:00.000Z
                required:
                  - serverNow
        "401":
          description: 未登录或账号已切换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
