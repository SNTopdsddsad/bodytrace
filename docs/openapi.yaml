# ⚠️ 本文件由 npm run docs:api 从真实校验 schema 生成，请勿手改。
openapi: 3.1.0
info:
  title: BodyTrace API
  version: 1.0.0
  description: |-
    BodyTrace（体重 / 饮食 / 训练记录）业务接口，供网页客户端与移动 App 共用。
    本文件由 npm run docs:api 从真实校验 schema 生成，请勿手改；契约以代码为准，背景说明见 docs/BodyTrace_API_Reference.md。

    ## 通用约定

    - 业务接口前缀 /api/v1，认证接口前缀 /api/auth（better-auth 托管）。
    - 所有业务接口需登录：网页走 cookie 会话（写请求还需携带可信 Origin）；App 登录后携带 Authorization: Bearer <token>（登录响应中的 token）。
    - 响应 JSON 为 camelCase，业务数据包在语义键里（{ foods }、{ entry } 等）。
    - /api/v1 业务错误为 { error: 说明 }，配合 400/401/404/409（照片另有 413/502/503）；404 表示不存在或不属于当前用户，不泄露其存在。
    - /api/auth 错误为 { code, message }。
    - 业务日期为 YYYY-MM-DD，按 APP_TIMEZONE（默认 Asia/Shanghai）计算今天；记录类接口拒绝未来日期。
    - 营养单位：热量 kcal，蛋白质/碳水/脂肪 g；食物库按每 100g 保存，饮食记录按实际克数折算为快照。

    ## 在线调试（Try it out）

    1. 先调 POST /api/auth/sign-in/email（或手机号 verify）拿到 token；
    2. 点 Authorize 填入 Bearer token；
    3. 在顶部 Servers 选择你的应用地址。

    注意：应用当前未开启 CORS，浏览器会拦截跨域 Try it out；同源部署（把本文档放到应用同域静态目录）或用 curl 示例调试。
servers:
  - url: http://localhost:3000
    description: 本地开发
  - url: https://your-deployment.example.com
    description: 你的部署地址（可临时改成任意地址）
tags:
  - name: 认证
    description: better-auth 托管的注册 / 登录 / 会话接口，App 从这里获取 Bearer token
  - name: 食物库
    description: 个人食物库按用户隔离；/reference 为共享只读官方参考库
  - name: 饮食记录
    description: 保存写入时刻的食物名称与营养快照；改克数按快照等比缩放
  - name: 饮食照片
    description: 照片独立归属 (userId, date, mealType)，每餐最多 6 张，文件存腾讯云 COS
  - name: 汇总与趋势
    description: 首页 / 日记共用的当日汇总与最近 N 天趋势
  - name: 目标与计划
    description: 每日目标与逐天手写的饮食计划；某天生效目标按日期从计划解析，否则回落每日目标
  - name: 身体指标
    description: 体重 kg / 体脂率 % / 血压 mmHg；乐观并发（version）与 requestId 幂等
  - name: 训练记录
    description: 一次训练含有序力量 / 有氧项目；requestId 幂等、version 乐观并发、服务端校时
  - name: 个人资料
    description: 性别 / 身高 / 体重 / 目标体重，null 表示未填写
  - name: 数据管理
    description: 一键清空本人全部业务记录
security:
  - cookieAuth: []
  - bearerAuth: []
externalDocs:
  description: 完整 API 参考（Markdown）
  url: https://github.com/SNTopdsddsad/bodytrace/blob/master/docs/BodyTrace_API_Reference.md
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: 网页端登录会话 cookie（better-auth 默认名）；写请求还需携带可信 Origin。
    bearerAuth:
      type: http
      scheme: bearer
      description: App 登录（sign-in/email 或 phone-number/verify）响应中的 token。
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: 面向人的说明，不作为稳定的机器错误代码
      required:
        - error
    AuthError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_OTP
        message:
          type: string
      required:
        - code
        - message
    OkResult:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          description: 手机注册用户为内部 .invalid 兼容地址
        phoneNumber:
          type:
            - string
            - "null"
        phoneNumberVerified:
          type: boolean
      required:
        - id
        - name
        - email
      additionalProperties: {}
    Macro:
      type: object
      properties:
        calories:
          type: number
          description: kcal
        protein:
          type: number
          description: g
        carbs:
          type: number
          description: g
        fat:
          type: number
          description: g
      required:
        - calories
        - protein
        - carbs
        - fat
    Goals:
      type: object
      properties:
        calories:
          type: integer
          minimum: 500
          maximum: 8000
        protein:
          type: integer
          minimum: 0
          maximum: 600
        carbs:
          type: integer
          minimum: 0
          maximum: 1200
        fat:
          type: integer
          minimum: 0
          maximum: 500
      required:
        - calories
        - protein
        - carbs
        - fat
    Food:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        name:
          type: string
        brand:
          type:
            - string
            - "null"
        calories:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        servingGrams:
          type:
            - number
            - "null"
        isFavorite:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - brand
        - calories
        - protein
        - carbs
        - fat
        - servingGrams
        - isFavorite
        - createdAt
        - updatedAt
    ReferenceFood:
      type: object
      properties:
        id:
          type: number
        foodCode:
          type: string
        name:
          type: string
        englishName:
          type:
            - string
            - "null"
        category:
          type: string
        calories:
          type:
            - number
            - "null"
        protein:
          type:
            - number
            - "null"
        carbs:
          type:
            - number
            - "null"
        fat:
          type:
            - number
            - "null"
        dietaryFiber:
          type:
            - number
            - "null"
        edible:
          type:
            - number
            - "null"
      required:
        - id
        - foodCode
        - name
        - englishName
        - category
        - calories
        - protein
        - carbs
        - fat
        - dietaryFiber
        - edible
    MealEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        date:
          type: string
        mealType:
          type: string
          enum:
            - breakfast
            - lunch
            - dinner
            - snack
        foodId:
          type:
            - string
            - "null"
          format: uuid
          description: 食物删除后为 null，记录仍可改克数、可删除
        name:
          type: string
        grams:
          type: number
        calories:
          type: number
        protein:
          type: number
        carbs:
          type: number
        fat:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - date
        - mealType
        - foodId
        - name
        - grams
        - calories
        - protein
        - carbs
        - fat
        - createdAt
    MealPhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
        mealType:
          type: string
          enum:
            - breakfast
            - lunch
            - dinner
            - snack
        url:
          type: string
          description: WebP 主图；签名地址不能长期缓存
        thumbUrl:
          type: string
          description: WebP 缩略图
        width:
          type: integer
        height:
          type: integer
        position:
          type: integer
          description: 餐内排序值从 0 递增；删除后不重排
      required:
        - id
        - date
        - mealType
        - url
        - thumbUrl
        - width
        - height
        - position
    DaySummary:
      type: object
      properties:
        date:
          type: string
        byMeal:
          type: array
          items:
            type: object
            properties:
              mealType:
                type: string
                enum:
                  - breakfast
                  - lunch
                  - dinner
                  - snack
              label:
                type: string
              entries:
                type: array
                items:
                  $ref: "#/components/schemas/MealEntry"
              photos:
                type: array
                items:
                  $ref: "#/components/schemas/MealPhoto"
            required:
              - mealType
              - label
              - entries
              - photos
        totals:
          $ref: "#/components/schemas/Macro"
        goals:
          $ref: "#/components/schemas/Goals"
        goalSource:
          type: string
          enum:
            - plan
            - base
          description: plan = 计划的当天目标；base = 每日目标兜底
      required:
        - date
        - byMeal
        - totals
        - goals
        - goalSource
    PlanItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=周一 … 6=周日
        mealType:
          type: string
          enum:
            - breakfast
            - lunch
            - dinner
            - snack
        foodId:
          type:
            - string
            - "null"
          format: uuid
          description: null 表示食物已删除的失效行
        name:
          type: string
        grams:
          type: number
        per100g:
          allOf:
            - $ref: "#/components/schemas/Macro"
            - type:
                - object
                - "null"
              description: 食物库当前每 100g 原始营养，仅在响应中提供
        calories:
          type:
            - number
            - "null"
        protein:
          type:
            - number
            - "null"
        carbs:
          type:
            - number
            - "null"
        fat:
          type:
            - number
            - "null"
      required:
        - id
        - weekday
        - mealType
        - foodId
        - name
        - grams
        - per100g
        - calories
        - protein
        - carbs
        - fat
    Plan:
      type: object
      properties:
        startDate:
          type: string
        isActive:
          type: boolean
        weekdays:
          type: array
          items:
            $ref: "#/components/schemas/Goals"
          description: 按周一到周日顺序，不含 weekday 序号
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
      required:
        - startDate
        - isActive
        - weekdays
        - items
    Measurement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - weight
            - bodyFat
            - bloodPressure
        date:
          type: string
        time:
          type:
            - string
            - "null"
          pattern: ^\d{2}:\d{2}$
        timeZone:
          type: string
        value:
          type:
            - string
            - "null"
          description: 体重/体脂十进制字符串（保存补齐两位，如 "79.50"）；血压为 null
        systolic:
          type:
            - integer
            - "null"
        diastolic:
          type:
            - integer
            - "null"
        period:
          type:
            - string
            - "null"
          enum:
            - morning
            - evening
            - null
          description: 血压时段；迁移前旧数据可能为 null
        note:
          type:
            - string
            - "null"
        version:
          type: integer
          description: 每次修改或删除递增
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - date
        - time
        - timeZone
        - value
        - systolic
        - diastolic
        - period
        - note
        - version
        - createdAt
        - updatedAt
    TrainingRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        date:
          type: string
        time:
          type:
            - string
            - "null"
        mode:
          type: string
          enum:
            - live
            - manual
        status:
          type: string
          enum:
            - inProgress
            - completed
        startedAt:
          type:
            - string
            - "null"
        durationMinutes:
          type:
            - integer
            - "null"
        note:
          type:
            - string
            - "null"
        items:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  kind:
                    type: string
                    enum:
                      - strength
                  name:
                    type: string
                    minLength: 1
                    maxLength: 80
                  mode:
                    type: string
                    enum:
                      - weighted
                      - bodyweight
                      - timed
                  sets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        weightKg:
                          type:
                            - number
                            - "null"
                          minimum: 0
                          maximum: 1000
                        reps:
                          type:
                            - integer
                            - "null"
                          minimum: 1
                          maximum: 10000
                        durationSeconds:
                          type:
                            - integer
                            - "null"
                          minimum: 1
                          maximum: 86400
                        completed:
                          type: boolean
                      required:
                        - id
                        - weightKg
                        - reps
                        - durationSeconds
                        - completed
                      additionalProperties: false
                    minItems: 1
                    maxItems: 50
                required:
                  - id
                  - kind
                  - name
                  - mode
                  - sets
                additionalProperties: false
              - type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  kind:
                    type: string
                    enum:
                      - cardio
                  name:
                    type: string
                    minLength: 1
                    maxLength: 80
                  durationMinutes:
                    type:
                      - integer
                      - "null"
                    minimum: 1
                    maximum: 1440
                  distanceKm:
                    type:
                      - number
                      - "null"
                    minimum: 0
                    maximum: 1000
                  completed:
                    type: boolean
                required:
                  - id
                  - kind
                  - name
                  - durationMinutes
                  - distanceKm
                  - completed
                additionalProperties: false
          maxItems: 50
        timeZone:
          type: string
          description: 创建时的服务端应用时区
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - date
        - time
        - mode
        - status
        - startedAt
        - durationMinutes
        - note
        - items
        - timeZone
        - version
        - createdAt
        - updatedAt
    Profile:
      type: object
      properties:
        gender:
          type:
            - string
            - "null"
          enum:
            - male
            - female
            - other
            - null
        heightCm:
          type:
            - number
            - "null"
        weightKg:
          type:
            - number
            - "null"
          description: 有测量时为最新测量体重
        targetWeightKg:
          type:
            - number
            - "null"
      required:
        - gender
        - heightCm
        - weightKg
        - targetWeightKg
  parameters: {}
paths:
  /api/auth/sign-up/email:
    post:
      operationId: signUpEmail
      tags:
        - 认证
      summary: 邮箱注册
      description: 保留的邮箱注册 API；网页注册入口已统一到手机号。密码 8–128 字符。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
                - name
                - email
                - password
      responses:
        "200":
          description: 注册成功，设置会话 cookie
          content:
            application/json: {}
        "400":
          description: 参数校验失败（如密码长度）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      tags:
        - 认证
      summary: 邮箱密码登录
      description: "App 客户端从响应中取 token 字段，供 Authorization: Bearer 调用。"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: 登录成功，设置会话 cookie；响应含 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/AuthUser"
                additionalProperties: {}
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/auth/phone-number/send-otp:
    post:
      operationId: sendLoginOtp
      tags:
        - 认证
      summary: 发送手机号登录验证码
      description: 支持大陆 11 位或 +86 格式，内部统一为 +86；成功不返回验证码。同号间隔默认 60 秒，另有同号每 24 小时 10 次、同来源每分钟 5 次限制（429 带 Retry-After）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                  example: "13800138000"
              required:
                - phoneNumber
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: code sent
                required:
                  - message
        "429":
          description: 触发频控
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "503":
          description: 短信未开放（SMS_UNAVAILABLE）或发送失败（SMS_SEND_FAILED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/auth/phone-number/verify:
    post:
      operationId: verifyLoginOtp
      tags:
        - 认证
      summary: 校验验证码并登录（首次自动注册）
      description: 验证码默认 6 位（SMS_CODE_LENGTH 可配 4–6），有效期默认 5 分钟，最多 3 次错误尝试、成功一次性消费，重发作废旧码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                code:
                  type: string
                  description: 数字字符串
              required:
                - phoneNumber
                - code
      responses:
        "200":
          description: 返回 {status, token, user} 并设置会话 cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  token:
                    type: string
                    description: Bearer 会话令牌（App 用）
                  user:
                    $ref: "#/components/schemas/AuthUser"
                additionalProperties: {}
        "400":
          description: INVALID_PHONE_INPUT / INVALID_OTP / OTP_EXPIRED 等
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: 尝试次数耗尽 TOO_MANY_ATTEMPTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/auth/sign-out:
    post:
      operationId: signOut
      tags:
        - 认证
      summary: 退出登录
      description: 作废当前会话。
      responses:
        "200":
          description: 已退出
          content:
            application/json: {}
        "400":
          description: 会话无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/auth/get-session:
    get:
      operationId: getCurrentSession
      tags:
        - 认证
      summary: 查询当前会话与用户
      security: []
      responses:
        "200":
          description: 会话信息；未登录返回 null
          content:
            application/json:
              schema:
                type:
                  - object
                  - "null"
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                additionalProperties: {}
        "400":
          description: 会话 cookie 损坏等客户端异常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags:
        - 认证
      summary: 申请密码重置（仅开发环境）
      description: 仅在 NODE_ENV=development 且应用地址为回环地址时开放，重置链接输出到服务端终端；其他环境返回 400 RESET_PASSWORD_DISABLED。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                redirectTo:
                  type: string
              required:
                - email
      responses:
        "200":
