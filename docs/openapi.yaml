    put:
      operationId: saveDietPlan
      tags:
        - 目标与计划
      summary: 整体保存饮食计划
      description: 全量替换七天目标与全部食物项（事务：计划行 upsert → 七天目标先删后插 → 食物项先删后插）。会改写 startDate（含）之后所有日期（含过去日期），没有历史版本。items[].foodId 为 uuid 时必须全部属于当前用户食物库，任一无效整单拒绝 400、不存在部分写入；为 null 表示保留一条已失效行，必须带它在 GET 响应里的 id。同餐顺序由请求数组顺序决定，请保持用户看到的顺序提交；items[].name 不可写，传入会被忽略。成功返回保存后读回的完整计划（带实时折算营养）。
