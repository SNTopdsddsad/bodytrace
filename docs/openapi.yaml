  /api/v1/meal-photos:
    post:
      operationId: uploadMealPhoto
      tags:
        - 饮食照片
      summary: 上传单张餐次照片
      description: 服务端按 EXIF 方向旋转、去 EXIF/GPS、转 WebP（主图长边 ≤1600px，缩略图 ≤480px）。支持 JPEG/PNG/WebP/AVIF（HEVC 编码 HEIC 需先转换），≤8 MiB、≤4000 万像素，每餐最多 6 张有效照片。带 requestId（当前用户内唯一）可幂等重试：首次成功 201，相同用户/编号/日期/餐次/文件重放 200；编号被用于其他日期/餐次/文件返回 409。重试必须复用原编号与同一份文件字节，不要重新压缩。
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp, image/avif
            schema:
              type: object
              properties:
                date:
                  type: string
                  description: 不能晚于应用时区的今天
                mealType:
                  type: string
                  enum:
                    - breakfast
                    - lunch
                    - dinner
                    - snack
                requestId:
                  type: string
                  format: uuid
                  description: 新客户端必传；幂等重试复用
                file:
                  type: string
                  format: binary
                  description: 单张非空图片，1 B–8 MiB
              required:
                - date
                - mealType
                - file
      responses:
        "200":
          description: 幂等重放，返回已保存的照片
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/MealPhoto"
                required:
                  - photo
        "201":
          description: 首次上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/MealPhoto"
                required:
                  - photo
        "400":
          description: 日期/餐次/UUID/文件非法，或该餐已满六张
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 未登录或 Origin 校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 上传提交前用户已被删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 编号用于其他日期/餐次/文件，或对应照片已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: 文件超过 8 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: COS / 数据库结果无法确认；不能据此认定未保存，应先 GET 核对
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: COS 配置不完整
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: checkMealPhotoByRequestId
      tags:
        - 饮食照片
      summary: 按请求编号核对上传结果
      description: "只按当前用户和 requestId 核对。已保存且未删除返回 { photo }；尚未查到返回 { photo: null }——null 不代表旧请求已取消，查询错误/超时不能当成 null。"
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: requestId
          in: query
      responses:
        "200":
          description: 核对结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    allOf:
                      - $ref: "#/components/schemas/MealPhoto"
                      - type:
                          - object
                          - "null"
                required:
                  - photo
        "400":
          description: 编号缺失或非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 对应照片已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: 数据库或地址生成暂不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/meal-photos/{photoId}:
