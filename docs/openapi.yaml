          name: x-bodytrace-user
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 1
                training:
                  type: object
                  properties:
                    title:
                      type: string
                      minLength: 1
                      maxLength: 80
                    date:
                      type: string
                      format: date
                    time:
                      type:
                        - string
                        - "null"
                      pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
                    mode:
                      type: string
                      enum:
                        - live
                        - manual
                    status:
                      type: string
                      enum:
                        - inProgress
                        - completed
                    startedAt:
                      type:
                        - string
                        - "null"
                      format: date-time
                    durationMinutes:
                      type:
                        - integer
                        - "null"
                      minimum: 1
                      maximum: 1440
                    note:
                      type:
                        - string
                        - "null"
                      maxLength: 1000
                    items:
                      type: array
                      items:
                        oneOf:
                          - type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              kind:
                                type: string
                                enum:
                                  - strength
                              name:
                                type: string
                                minLength: 1
                                maxLength: 80
                              mode:
                                type: string
                                enum:
                                  - weighted
                                  - bodyweight
                                  - timed
                              sets:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      format: uuid
                                    weightKg:
                                      type:
                                        - number
                                        - "null"
                                      minimum: 0
                                      maximum: 1000
                                    reps:
                                      type:
                                        - integer
                                        - "null"
                                      minimum: 1
                                      maximum: 10000
                                    durationSeconds:
                                      type:
                                        - integer
                                        - "null"
                                      minimum: 1
                                      maximum: 86400
                                    completed:
                                      type: boolean
                                  required:
                                    - id
                                    - weightKg
                                    - reps
                                    - durationSeconds
                                    - completed
                                  additionalProperties: false
                                minItems: 1
                                maxItems: 50
                            required:
                              - id
                              - kind
                              - name
                              - mode
                              - sets
                            additionalProperties: false
                          - type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              kind:
                                type: string
                                enum:
                                  - cardio
                              name:
                                type: string
                                minLength: 1
                                maxLength: 80
                              durationMinutes:
                                type:
                                  - integer
                                  - "null"
                                minimum: 1
                                maximum: 1440
                              distanceKm:
                                type:
                                  - number
                                  - "null"
                                minimum: 0
                                maximum: 1000
                              completed:
                                type: boolean
                            required:
                              - id
                              - kind
                              - name
                              - durationMinutes
                              - distanceKm
                              - completed
                            additionalProperties: false
                      maxItems: 50
                  required:
                    - title
                    - date
                    - time
                    - mode
                    - status
                    - startedAt
                    - durationMinutes
                    - note
                    - items
                  additionalProperties: false
              required:
                - version
                - training
              additionalProperties: false
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: "#/components/schemas/TrainingRecord"
                required:
                  - entry
        "400":
          description: 参数校验失败
          content:
            application/json:
