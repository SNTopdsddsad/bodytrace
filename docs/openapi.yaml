  /api/v1/profile:
    get:
      operationId: getProfile
      tags:
        - 个人资料
      summary: 查询个人资料
      description: null 表示未填写。已有测量记录时 weightKg 为最新测量体重，无测量时为旧资料值。
      responses:
        "200":
          description: 个人资料
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
                required:
                  - profile
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveProfile
      tags:
        - 个人资料
      summary: 保存个人资料
      description: 不是 PATCH 语义：gender/heightCm/targetWeightKg 必须同时提交（未填写的传 null，传 null 会清空旧值）。只有 weightKg 可省略（保留旧值）。已有测量体重时，提交不同的 weightKg 返回 409（体重应通过身体指标接口修改）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gender:
                  type:
                    - string
                    - "null"
                  enum:
                    - male
                    - female
                    - other
                    - null
                heightCm:
                  type:
                    - number
                    - "null"
                  minimum: 50
                  maximum: 280
                weightKg:
                  type:
                    - number
                    - "null"
                  minimum: 20
                  maximum: 500
                targetWeightKg:
                  type:
                    - number
                    - "null"
                  minimum: 20
                  maximum: 500
              required:
                - gender
                - heightCm
                - targetWeightKg
      responses:
        "200":
          description: 保存成功（读取语义同 GET）
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
                required:
                  - profile
        "400":
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 提交的 weightKg 与最新测量体重不一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/records:
    delete:
      operationId: clearAllRecords
      tags:
        - 数据管理
      summary: 一键清空本人全部业务记录
      description: 同一事务内硬删除全部饮食记录、餐次照片、身体指标与训练（含草稿及此前软删除行）。个人食物库、每日目标、饮食计划和个人资料不受影响。重复调用成功；两次之间没有新写入时数量为 0。cleared 含已软删除的行，可能大于界面可见数量。硬删除会清除幂等编号占用：清空后重放旧新增请求可能重新创建记录，客户端应停止上传并刷新状态。
      responses:
        "200":
          description: 清空结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  cleared:
                    type: object
                    properties:
                      mealEntries:
                        type: integer
                      measurements:
                        type: integer
                      mealPhotos:
                        type: integer
                      trainingRecords:
                        type: integer
                    required:
                      - mealEntries
                      - measurements
                      - mealPhotos
                      - trainingRecords
                required:
                  - ok
                  - cleared
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
