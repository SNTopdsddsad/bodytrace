            schema:
              type: object
              properties:
                startDate:
                  type: string
                isActive:
                  type: boolean
                weekdays:
                  type: array
                  items:
                    type: object
                    properties:
                      calories:
                        type: integer
                        minimum: 500
                        maximum: 8000
                      protein:
                        type: integer
                        minimum: 0
                        maximum: 600
                      carbs:
                        type: integer
                        minimum: 0
                        maximum: 1200
                      fat:
                        type: integer
                        minimum: 0
                        maximum: 500
                    required:
                      - calories
                      - protein
                      - carbs
                      - fat
                items:
                  type: array
                  items:
                    anyOf:
                      - type: object
                        properties:
                          weekday:
                            type: integer
                            minimum: 0
                            maximum: 6
                          mealType:
                            type: string
                            enum:
                              - breakfast
                              - lunch
                              - dinner
                              - snack
                          grams:
                            type: number
                            minimum: 1
                            maximum: 5000
                          foodId:
                            type: string
                            format: uuid
                          id:
                            type: string
                            format: uuid
                        required:
                          - weekday
                          - mealType
                          - grams
                          - foodId
                      - type: object
                        properties:
                          weekday:
                            type: integer
                            minimum: 0
                            maximum: 6
                          mealType:
                            type: string
                            enum:
                              - breakfast
                              - lunch
                              - dinner
                              - snack
                          grams:
                            type: number
                            minimum: 1
                            maximum: 5000
                          foodId:
                            type: "null"
                          id:
                            type: string
                            format: uuid
                        required:
                          - weekday
                          - mealType
                          - grams
                          - foodId
                          - id
                  maxItems: 400
              required:
