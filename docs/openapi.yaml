    patch:
      operationId: updateTrainingRecord
      tags:
        - 训练记录
      summary: 更新训练记录（乐观并发）
      description: "{version, training} 整次训练的项目、组、顺序与版本原子更新；成功后 version +1。旧版本返回 409，紧接的一次相同版本/相同内容重试返回已有结果。mode 与 startedAt 固定不可改；每次进入 completed 都需满足完成校验。草稿自动保存须串行提交；超时先读详情，仅当版本恰好推进一次且内容一致才确认成功。"
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: string
            description: 网页携带的初始账号标识，服务端仅与当前会话比较（不一致 401）；原生客户端可省略
          required: false
