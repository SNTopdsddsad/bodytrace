<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BodyTrack</title>
  <style>
    :root { --ink: #1c2423; --teal: #267a78; --bg: #f6f8f7; --muted: #5b6866; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--ink);

    main { padding: 2rem 1.25rem; max-width: 28rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); line-height: 1.6; }
    a { color: var(--teal); display: inline-block; margin-right: 1.25rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>BodyTrack</h1>
    <p>在 iPhone 上记录体重、饮食热量，并可与 Apple 健康同步体重与运动。</p>
    <a href="./privacy-policy.html">隐私政策</a>
    <a href="./support.html">支持与帮助</a>
  </main>

</html>
