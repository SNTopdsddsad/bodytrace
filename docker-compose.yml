# 本地开发的 MySQL 8.4 LTS；云 MySQL 直接配置 DATABASE_URL 即可。
# 启动：docker compose up -d mysql    停止：docker compose stop mysql
# 数据保存在独立目录，不使用旧 PostgreSQL 的数据目录。
services:
  mysql:
    image: mysql:8.4
    container_name: bodytrace-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: bodytrace-root
      MYSQL_DATABASE: bodytrace
      MYSQL_USER: bodytrace
      MYSQL_PASSWORD: bodytrace
    ports:
      - "3307:3306"
    volumes:
      - D:/docker/bodytrace-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
